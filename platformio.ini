[platformio]
default_envs = node_polling

[env]
build_flags = -std=gnu++17 -Wall -Wextra

; RadioHead is deliberately NOT pinned in lib_deps. framework-arduinoteensy
; bundles its own copy (currently 1.112), and adding a registry pin makes
; PlatformIO's dependency finder compile headers from one copy against sources
; from the other. If a framework upgrade ever changes the bundled version,
; check RH_RF95's API against src/hal/teensy_radio.hpp rather than adding a pin.
;
; Adafruit BNO055 is scoped to node_polling rather than shared here: the gateway
; has no IMU, and pulling the library into that build makes Adafruit BusIO fail
; to resolve SPI.h.
[teensy_base]
platform = teensy
board = teensy41
framework = arduino
monitor_speed = 115200
upload_protocol = teensy-cli

[env:node_polling]
extends = teensy_base
build_src_filter = +<*> -<gateway_main.cpp> -<sampler_interrupt.cpp>
build_flags = ${env.build_flags} -D FLOODNET_SAMPLER_POLLING
lib_deps =
    adafruit/Adafruit BNO055@^1.6.3

[env:node_interrupt]
extends = teensy_base
build_src_filter = +<*> -<gateway_main.cpp> -<sampler_polling.cpp>
build_flags = ${env.build_flags} -D FLOODNET_SAMPLER_INTERRUPT
lib_deps =
    adafruit/Adafruit BNO055@^1.6.3

[env:gateway]
extends = teensy_base
build_src_filter = +<*> -<main.cpp> -<sampler_polling.cpp> -<sampler_interrupt.cpp>

[env:native]
platform = native
lib_compat_mode = off
test_build_src = yes
build_src_filter = +<sampler_polling.cpp> +<sampler_interrupt.cpp>
build_flags = ${env.build_flags} -I src
lib_deps =
    floodnet_core
    floodnet_hal
