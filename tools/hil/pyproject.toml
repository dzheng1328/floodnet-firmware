[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floodnet-hil"
version = "0.1.0"
description = "Capture and analyze FloodNet node and gateway serial logs"
requires-python = ">=3.10"
dependencies = ["pyserial>=3.5"]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
floodnet-hil = "floodnet_hil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Import the package from src directly, so the tests do not depend on an
# editable install's .pth file being honoured.
pythonpath = ["src"]
