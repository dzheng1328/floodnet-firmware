name: CI

on:
  push:
  pull_request:

jobs:
  test:
    name: Native unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Enforce HAL seam
        run: |
          if grep -rn "Arduino.h\|Wire.h\|SPI.h" lib/; then
            echo "A hardware header leaked into lib/. The core must stay host-testable."
            exit 1
          fi
      - name: Run unit tests
        run: pio test -e native

  build:
    name: Firmware build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install PlatformIO
        run: pip install platformio
      - name: Build node and gateway
        run: pio run -e node_polling -e gateway
